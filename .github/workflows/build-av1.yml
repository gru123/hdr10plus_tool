name: Build AV1 Support

on:
  push:
    branches:
      - av1-support
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: hdr10plus_tool
            asset_name: hdr10plus_tool-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: hdr10plus_tool.exe
            asset_name: hdr10plus_tool-windows-x64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: hdr10plus_tool
            asset_name: hdr10plus_tool-macos-x64
          # Jeśli chcesz także obsługiwać Apple Silicon (M1/M2), odkomentuj poniższe
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   artifact_name: hdr10plus_tool
          #   asset_name: hdr10plus_tool-macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Instalacja zależności systemowych (tylko Linux wymaga fontconfig)
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Kluczowy krok: przesyłaj tylko sam plik wykonywalny, a nie cały folder
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
