name: Build and Release AV1 Support

on:
  push:
    branches:
      - av1-support
    tags:
      - 'v*' # Wyzwalaj tylko przy wypychaniu tagów rozpoczynających się od v
  workflow_dispatch:

jobs:
  build:
    strategy:
      max-parallel: 1   # ← Dodaj tę linię
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: hdr10plus_tool
            asset_name: hdr10plus_tool-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: hdr10plus_tool.exe
            asset_name: hdr10plus_tool-windows-x64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: hdr10plus_tool
            asset_name: hdr10plus_tool-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: hdr10plus_tool
            asset_name: hdr10plus_tool-macos-arm64
            
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Wymagane do tworzenia wydań i przesyłania zasobów

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Użyj softprops/action-gh-release do przesłania do GitHub Releases
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') # Wykonuj tylko przy wypychaniu tagów
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}   # ← to sprawia, że plik w Releases ma nazwę z systemem
          generate_release_notes: false           # ← wyłącz, żeby nie było duplikatów
